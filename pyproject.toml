[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-deep-research-agent"
version = "0.1.0"
description = "Budgeted research agent and reproducible decision trajectories"
requires-python = ">=3.11"
dependencies = ["langgraph>=1,<2", "pydantic>=2,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
live = ["langchain[anthropic]>=1,<2"]
dev = ["pytest>=8,<10"]
lint = ["ruff>=0.11,<1"]

[project.scripts]
adra = "adra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
